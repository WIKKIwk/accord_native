plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.accordchatsecure'
version = '0.1.0'

android {
  namespace 'expo.modules.accordchatsecure'
  defaultConfig { versionCode 1; versionName '0.1.0' }
}

dependencies {
  // This is also the version declared by this checkout's React Native and Expo modules.
  implementation 'com.squareup.okhttp3:okhttp:4.9.2'
}
