plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.accordnativeclock'
version = '0.1.0'

android {
  namespace 'expo.modules.accordnativeclock'
  ndkVersion rootProject.ext.ndkVersion
  defaultConfig { versionCode 1; versionName '0.1.0'; consumerProguardFiles 'consumer-rules.pro' }
  externalNativeBuild {
    cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
  }
}
