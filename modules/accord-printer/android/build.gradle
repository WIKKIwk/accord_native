plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.accordprinter'
version = '0.1.0'

android {
  namespace "expo.modules.accordprinter"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}


dependencies {
  implementation files('libs/printer-lib-3.5.8.aar')
}
