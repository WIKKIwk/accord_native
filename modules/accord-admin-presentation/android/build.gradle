plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.accordadminpresentation'
version = '0.1.0'

android {
  namespace 'expo.modules.accordadminpresentation'
  defaultConfig { versionCode 1; versionName '0.1.0' }
}

// Public APIs/resources from the app's existing SDK artifacts. Android AARs require implementation.
dependencies {
  implementation 'com.facebook.react:react-android'
  // Already present at runtime through @expo/ui 58.0.26; no new JS package or Compose plugin.
  implementation 'com.google.android.material:material:1.13.0'
  implementation 'androidx.core:core-ktx:1.18.0'
}
