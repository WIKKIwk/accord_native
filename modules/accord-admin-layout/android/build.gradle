plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.accordadminlayout'
version = '0.1.0'

android {
  namespace 'expo.modules.accordadminlayout'
  defaultConfig { versionCode 1; versionName '0.1.0' }
}

// Public ReactFindViewUtil from the already installed app React SDK; no new runtime dependency.
dependencies { compileOnly 'com.facebook.react:react-android' }
